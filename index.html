<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOAA Buoy Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background-color: #f4f6f8; }
        header { background: #003366; color: white; padding: 15px 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000; }
        header h2 { margin: 0; padding-bottom: 5px; font-size: 20px;}
        header p { margin: 0; font-size: 14px; opacity: 0.8; }
        #app-container { display: flex; flex: 1; flex-direction: column; overflow: hidden; }
        #map { flex: 1; min-height: 45vh; border-bottom: 3px solid #003366; }
        #data-panel { flex: 1; padding: 20px; overflow-y: auto; background: white; display: flex; flex-direction: column; align-items: center; }
        canvas { max-height: 300px; width: 100%; max-width: 1000px; }
        .loading { display: none; color: #003366; font-weight: bold; margin-bottom: 10px; text-align: center; }
        .error-text { color: #cc0000; }
        @media (min-width: 768px) { #app-container { flex-direction: row; } #map { border-bottom: none; border-right: 3px solid #003366; } #data-panel { padding: 30px; } }
    </style>
</head>
<body>
    <header>
        <h2>🌊 Michigan & NOAA Buoy Explorer</h2>
        <p>Click any buoy marker to fetch live water temperatures</p>
    </header>
    <div id="app-container">
        <div id="map"></div>
        <div id="data-panel">
            <h3 id="station-title">Select a buoy on the map</h3>
            <p id="loading-text" class="loading">Connecting directly to NOAA NDBC...</p>
            <canvas id="weatherChart"></canvas>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const map = L.map('map').setView([43.2, -86.5], 7); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        const buoys = [
            { id: "45161", lat: 43.18, lon: -86.35, name: "Muskegon, MI" },
            { id: "45024", lat: 43.95, lon: -86.63, name: "Ludington, MI" },
            { id: "45029", lat: 42.75, lon: -86.36, name: "Holland, MI" },
            { id: "45026", lat: 42.11, lon: -86.39, name: "St. Joseph, MI" },
            { id: "45007", lat: 42.67, lon: -87.02, name: "South Lake Michigan" },
            { id: "45002", lat: 45.34, lon: -86.41, name: "North Lake Michigan" },
            { id: "45020", lat: 44.79, lon: -85.60, name: "Grand Traverse Bay, MI" }
        ];

        buoys.forEach(buoy => {
            const marker = L.marker([buoy.lat, buoy.lon]).addTo(map);
            marker.bindPopup(`<b>${buoy.name}</b><br>Station ID: ${buoy.id}<br><br><i>Click to load data</i>`);
            marker.on('click', () => { fetchNDBCData(buoy.id, buoy.name); });
        });

        let chartInstance = null;

        // Custom time formatter for clean chart labels
        function formatTime(date) {
            const month = date.toLocaleDateString('en-US', { month: 'short' });
            const day = date.getDate();
            let hour = date.getHours();
            const ampm = hour >= 12 ? 'pm' : 'am';
            hour = hour % 12;
            hour = hour ? hour : 12; 
            return `${month} ${day}, ${hour}${ampm}`;
        }

        async function fetchNDBCData(stationId, stationName) {
            const titleEl = document.getElementById('station-title');
            const loadingEl = document.getElementById('loading-text');
            
            titleEl.innerText = `7-Day Water Temp: Station ${stationId} (${stationName})`;
            loadingEl.style.display = 'block';
            loadingEl.className = 'loading';
            loadingEl.innerText = 'Connecting directly to NDBC...';
            
            if (chartInstance) chartInstance.destroy();

            // Bypass CORS and hit the raw NDBC text file directly 
            const ndbcUrl = `https://www.ndbc.noaa.gov/data/realtime2/${stationId}.txt`;
            const url = `https://api.allorigins.win/raw?url=${encodeURIComponent(ndbcUrl)}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Could not connect to NDBC");
                const text = await response.text();
                
                // If it returns an HTML error page instead of data text
                if (text.trim().startsWith("<")) throw new Error("Offline");

                const lines = text.trim().split('\n');
                const labels = [];
                const waterTemp = [];
                
                const now = new Date();
                const sevenDaysAgo = new Date(now.getTime() - (7 * 24 * 60 * 60 * 1000));

                // Parse standard NDBC text rows (skip first two header rows)
                for (let i = 2; i < lines.length; i++) {
                    const cols = lines[i].trim().split(/\s+/);
                    if (cols.length < 15) continue;
                    
                    const year = parseInt(cols[0]);
                    const month = parseInt(cols[1]) - 1; // JS dates are 0-11
                    const day = parseInt(cols[2]);
                    const hour = parseInt(cols[3]);
                    const min = parseInt(cols[4]);
                    
                    const dateObj = new Date(Date.UTC(year, month, day, hour, min));
                    
                    // Since file is newest first, stop reading once we hit 7 days ago
                    if (dateObj < sevenDaysAgo) break;

                    const wtmpStr = cols[14]; 
                    if (wtmpStr === "MM") continue; // "MM" is NDBC's flag for missing/broken sensor
                    
                    const tempC = parseFloat(wtmpStr);
                    const tempF = (tempC * 9/5) + 32; // Convert to Fahrenheit

                    labels.unshift(formatTime(dateObj));
                    waterTemp.unshift(tempF);
                }
                
                if (waterTemp.length === 0) throw new Error("No recent data");

                loadingEl.style.display = 'none';
                updateChart(labels, waterTemp);

            } catch (error) {
                console.error(error);
                loadingEl.className = 'loading error-text';
                loadingEl.innerText = "Data currently unavailable. This buoy is pulled from the water or not reporting temps right now.";
            }
        }

        function updateChart(labels, waterTemp) {
            const ctx = document.getElementById('weatherChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Water Temp (°F)',
                        data: waterTemp,
                        borderColor: '#0055ff',
                        backgroundColor: 'rgba(0, 85, 255, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0,
                        spanGaps: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: { title: { display: true, text: 'Time (Last 7 Days)' }, ticks: { maxTicksLimit: 10 } },
                        y: { title: { display: true, text: 'Water Temp (°F)' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
