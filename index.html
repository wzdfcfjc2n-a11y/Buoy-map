<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michigan Buoy Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background-color: #f4f6f8; }
        header { background: #003366; color: white; padding: 15px 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000; }
        header h2 { margin: 0; padding-bottom: 5px; font-size: 20px;}
        header p { margin: 0; font-size: 14px; opacity: 0.8; }
        #app-container { display: flex; flex: 1; flex-direction: column; overflow: hidden; }
        #map { flex: 1; min-height: 45vh; border-bottom: 3px solid #003366; }
        #data-panel { flex: 1; padding: 20px; overflow-y: auto; background: white; display: flex; flex-direction: column; align-items: center; }
        canvas { max-height: 300px; width: 100%; max-width: 1000px; }
        .loading { display: none; color: #003366; font-weight: bold; margin-bottom: 10px; text-align: center; }
        .error-text { color: #cc0000; }
        @media (min-width: 768px) { #app-container { flex-direction: row; } #map { border-bottom: none; border-right: 3px solid #003366; } #data-panel { padding: 30px; } }
    </style>
</head>
<body>
    <header>
        <h2>🌊 Michigan Water Temp Explorer</h2>
        <p>Click any marker to fetch live water temperatures</p>
    </header>
    <div id="app-container">
        <div id="map"></div>
        <div id="data-panel">
            <h3 id="station-title">Select a location on the map</h3>
            <p id="loading-text" class="loading">Loading data securely...</p>
            <canvas id="weatherChart"></canvas>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const map = L.map('map').setView([43.2, -86.5], 7); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        // Standard NDBC buoy stations in Lake Michigan
        const buoys = [
            { id: "45161", lat: 43.18, lon: -86.35, name: "Muskegon, MI" },
            { id: "45024", lat: 43.95, lon: -86.63, name: "Ludington, MI" },
            { id: "45029", lat: 42.75, lon: -86.36, name: "Holland, MI" },
            { id: "45026", lat: 42.11, lon: -86.39, name: "St. Joseph, MI" },
            { id: "45020", lat: 44.79, lon: -85.60, name: "Grand Traverse Bay, MI" }
        ];

        buoys.forEach(buoy => {
            const marker = L.marker([buoy.lat, buoy.lon]).addTo(map);
            marker.bindPopup(`<b>${buoy.name}</b><br>Station ID: ${buoy.id}<br><br><i>Click to load data</i>`);
            marker.on('click', () => { fetchErddapData(buoy.id, buoy.name); });
        });

        let chartInstance = null;

        function formatTime(dateObj) {
            const month = dateObj.toLocaleDateString('en-US', { month: 'short' });
            const day = dateObj.getDate();
            let hour = dateObj.getHours();
            const ampm = hour >= 12 ? 'pm' : 'am';
            hour = hour % 12;
            hour = hour ? hour : 12; 
            return `${month} ${day}, ${hour}${ampm}`;
        }

        async function fetchErddapData(stationId, stationName) {
            const titleEl = document.getElementById('station-title');
            const loadingEl = document.getElementById('loading-text');
            
            titleEl.innerText = `7-Day Water Temp: ${stationName}`;
            loadingEl.style.display = 'block';
            loadingEl.className = 'loading';
            loadingEl.innerText = 'Connecting directly to NOAA...';
            
            if (chartInstance) chartInstance.destroy();

            // Create a strict ISO date string for 7 days ago
            const d = new Date();
            d.setDate(d.getDate() - 7);
            
            // CRITICAL FIX: Strip the fractional milliseconds (.123Z) from the time string!
            // NOAA ERDDAP rejects milliseconds and will throw a server error if they are included.
            const timeString = d.toISOString().split('.')[0] + 'Z'; 

            // Safely URL-encoded for Safari: %22 is ("), %3E is (>)
            const url = `https://coastwatch.pfeg.noaa.gov/erddap/tabledap/cwwcNDBCMet.json?time,wtmp&station=%22${stationId}%22&time%3E=${timeString}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("NOAA ERDDAP database request failed");
                const jsonData = await response.json();
                
                const rows = jsonData.table.rows;
                const labels = [];
                const waterTempF = [];

                rows.forEach(row => {
                    const dateObj = new Date(row[0]);
                    labels.push(formatTime(dateObj));
                    
                    const tempC = parseFloat(row[1]);
                    // Only convert and chart valid numbers. If NOAA reports a broken sensor (NaN), skip it gracefully.
                    if (!isNaN(tempC)) {
                        waterTempF.push((tempC * 9/5) + 32);
                    } else {
                        waterTempF.push(null);
                    }
                });

                if (waterTempF.length === 0) throw new Error("No recent temperature data found");

                loadingEl.style.display = 'none';
                updateChart(labels, waterTempF);

            } catch (error) {
                console.error(error);
                loadingEl.className = 'loading error-text';
                loadingEl.innerText = "Data currently unavailable. The buoy may be offline or NOAA is delaying updates.";
            }
        }

        function updateChart(labels, waterTemp) {
            const ctx = document.getElementById('weatherChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Water Temp (°F)',
                        data: waterTemp,
                        borderColor: '#0055ff',
                        backgroundColor: 'rgba(0, 85, 255, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0,
                        spanGaps: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: { title: { display: true, text: 'Time (Last 7 Days)' }, ticks: { maxTicksLimit: 10 } },
                        y: { title: { display: true, text: 'Water Temp (°F)' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
