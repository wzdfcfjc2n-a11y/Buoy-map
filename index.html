<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOAA Buoy Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background-color: #f4f6f8; }
        header { background: #003366; color: white; padding: 15px 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000; }
        header h2 { margin: 0; padding-bottom: 5px; font-size: 20px;}
        header p { margin: 0; font-size: 14px; opacity: 0.8; }
        #app-container { display: flex; flex: 1; flex-direction: column; overflow: hidden; }
        #map { flex: 1; min-height: 45vh; border-bottom: 3px solid #003366; }
        #data-panel { flex: 1; padding: 20px; overflow-y: auto; background: white; display: flex; flex-direction: column; align-items: center; }
        canvas { max-height: 300px; width: 100%; max-width: 1000px; }
        .loading { display: none; color: #003366; font-weight: bold; margin-bottom: 10px; }
        @media (min-width: 768px) { #app-container { flex-direction: row; } #map { border-bottom: none; border-right: 3px solid #003366; } #data-panel { padding: 30px; } }
    </style>
</head>
<body>
    <header>
        <h2>🌊 Michigan & NOAA Buoy Explorer</h2>
        <p>Click any buoy marker to fetch live water temperatures</p>
    </header>
    <div id="app-container">
        <div id="map"></div>
        <div id="data-panel">
            <h3 id="station-title">Select a buoy on the map</h3>
            <p id="loading-text" class="loading">Fetching data from NOAA ERDDAP...</p>
            <canvas id="weatherChart"></canvas>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Center the map specifically on Lake Michigan
        const map = L.map('map').setView([43.2, -86.5], 7); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        // Expanded list to include West Michigan Buoys
        const buoys = [
            { id: "45020", lat: 43.18, lon: -86.36, name: "Muskegon, MI" },
            { id: "45024", lat: 43.95, lon: -86.63, name: "Ludington, MI" },
            { id: "45029", lat: 42.75, lon: -86.36, name: "Holland, MI" },
            { id: "45026", lat: 42.11, lon: -86.39, name: "St. Joseph, MI" },
            { id: "45007", lat: 42.67, lon: -87.02, name: "South Lake Michigan" },
            { id: "45002", lat: 45.34, lon: -86.41, name: "North Lake Michigan" },
            { id: "46042", lat: 36.75, lon: -122.42, name: "Monterey, CA" },
            { id: "44092", lat: 39.81, lon: -73.08, name: "New York Bight" }
        ];

        buoys.forEach(buoy => {
            const marker = L.marker([buoy.lat, buoy.lon]).addTo(map);
            marker.bindPopup(`<b>${buoy.name}</b><br>Station ID: ${buoy.id}<br><br><i>Click to load data</i>`);
            marker.on('click', () => { fetchErddapData(buoy.id, buoy.name); });
        });

        let chartInstance = null;

        async function fetchErddapData(stationId, stationName) {
            document.getElementById('station-title').innerText = `7-Day Water Temp: Station ${stationId} (${stationName})`;
            document.getElementById('loading-text').style.display = 'block';

            // Updated API URL: Only asks for Water Temp (wtmp) to prevent crashes
            const url = `https://coastwatch.pfeg.noaa.gov/erddap/tabledap/cwwcNDBCMet.json?time,wtmp&station="${stationId}"&time>=now-7days`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("ERDDAP request failed");
                const jsonData = await response.json();
                
                const rows = jsonData.table.rows;
                const labels = [];
                const waterTemp = [];

                rows.forEach(row => {
                    const dateObj = new Date(row[0]);
                    labels.push(dateObj.toLocaleDateString() + ' ' + dateObj.getHours() + ':00');
                    waterTemp.push(row[1]);
                });

                updateChart(labels, waterTemp);

            } catch (error) {
                console.error(error);
                alert("Data currently unavailable for this buoy. It may be offline for maintenance or not reporting water temperatures right now.");
            } finally {
                document.getElementById('loading-text').style.display = 'none';
            }
        }

        function updateChart(labels, waterTemp) {
            const ctx = document.getElementById('weatherChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Water Temp (°C)',
                        data: waterTemp,
                        borderColor: '#0055ff',
                        backgroundColor: 'rgba(0, 85, 255, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: { title: { display: true, text: 'Time (Last 7 Days)' }, ticks: { maxTicksLimit: 10 } },
                        y: { title: { display: true, text: 'Water Temp (°C)' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
