<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michigan Buoy Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background-color: #f4f6f8; }
        header { background: #003366; color: white; padding: 15px 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 1000; }
        header h2 { margin: 0; padding-bottom: 5px; font-size: 20px;}
        header p { margin: 0; font-size: 14px; opacity: 0.8; }
        #app-container { display: flex; flex: 1; flex-direction: column; overflow: hidden; }
        #map { flex: 1; min-height: 45vh; border-bottom: 3px solid #003366; }
        #data-panel { flex: 1; padding: 20px; overflow-y: auto; background: white; display: flex; flex-direction: column; align-items: center; }
        canvas { max-height: 300px; width: 100%; max-width: 1000px; }
        .loading { display: none; color: #003366; font-weight: bold; margin-bottom: 10px; text-align: center; }
        .error-text { color: #cc0000; }
        @media (min-width: 768px) { #app-container { flex-direction: row; } #map { border-bottom: none; border-right: 3px solid #003366; } #data-panel { padding: 30px; } }
    </style>
</head>
<body>
    <header>
        <h2>🌊 Michigan Water Temp Explorer</h2>
        <p>Click any marker to fetch live water temperatures</p>
    </header>
    <div id="app-container">
        <div id="map"></div>
        <div id="data-panel">
            <h3 id="station-title">Select a location on the map</h3>
            <p id="loading-text" class="loading">Loading data securely...</p>
            <canvas id="weatherChart"></canvas>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const map = L.map('map').setView([43.2, -86.5], 7); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        const locations = [
            { lat: 43.18, lon: -86.35, name: "Muskegon, MI" },
            { lat: 43.95, lon: -86.63, name: "Ludington, MI" },
            { lat: 42.75, lon: -86.36, name: "Holland, MI" },
            { lat: 42.11, lon: -86.39, name: "St. Joseph, MI" },
            { lat: 44.79, lon: -85.60, name: "Grand Traverse Bay, MI" }
        ];

        locations.forEach(loc => {
            const marker = L.marker([loc.lat, loc.lon]).addTo(map);
            marker.bindPopup(`<b>${loc.name}</b><br><i>Click to load data</i>`);
            marker.on('click', () => { fetchWeatherData(loc.lat, loc.lon, loc.name); });
        });

        let chartInstance = null;

        function formatTime(isoString) {
            const date = new Date(isoString);
            const month = date.toLocaleDateString('en-US', { month: 'short' });
            const day = date.getDate();
            let hour = date.getHours();
            const ampm = hour >= 12 ? 'pm' : 'am';
            hour = hour % 12;
            hour = hour ? hour : 12; 
            return `${month} ${day}, ${hour}${ampm}`;
        }

        async function fetchWeatherData(lat, lon, name) {
            const titleEl = document.getElementById('station-title');
            const loadingEl = document.getElementById('loading-text');
            
            titleEl.innerText = `7-Day Water Temp: ${name}`;
            loadingEl.style.display = 'block';
            loadingEl.className = 'loading';
            loadingEl.innerText = 'Fetching secure data...';
            
            if (chartInstance) chartInstance.destroy();

            // Open-Meteo Marine API - No proxies, 100% Safari compatible!
            const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=ocean_temperature&past_days=7&forecast_days=0`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("API request failed");
                const data = await response.json();
                
                const labels = [];
                const waterTempF = [];
                
                const times = data.hourly.time;
                const tempsC = data.hourly.ocean_temperature;

                for (let i = 0; i < times.length; i++) {
                    if (tempsC[i] !== null) {
                        labels.push(formatTime(times[i]));
                        // Automatically converts Celsius to Fahrenheit
                        waterTempF.push((tempsC[i] * 9/5) + 32);
                    }
                }

                if (waterTempF.length === 0) throw new Error("No data");

                loadingEl.style.display = 'none';
                updateChart(labels, waterTempF);

            } catch (error) {
                console.error(error);
                loadingEl.className = 'loading error-text';
                loadingEl.innerText = "Error loading data. Please check your internet connection.";
            }
        }

        function updateChart(labels, waterTemp) {
            const ctx = document.getElementById('weatherChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Water Temp (°F)',
                        data: waterTemp,
                        borderColor: '#0055ff',
                        backgroundColor: 'rgba(0, 85, 255, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0,
                        spanGaps: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: { title: { display: true, text: 'Time (Last 7 Days)' }, ticks: { maxTicksLimit: 10 } },
                        y: { title: { display: true, text: 'Water Temp (°F)' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
